<!-- templates/cards/box.html -->

{% extends "cards/base.html" %}

{% block content %}
    <h2>{{ box_number}} Стопка </h2>
    <mark>{{ object_list | length }}</mark> Карточек в стопке.
    <hr>
    {% if check_card %}
        {% include "cards/card.html" with card=check_card %}
    {% endif %}
{% endblock content %}
